name: Validate zip permissions

on:
  pull_request:
    paths:
      - '**/*.zip'
      - '.github/scripts/check_zip_permissions.py'
      - '.github/scripts/repack_connector_function.py'
      - '.github/workflows/validate-zips.yml'
      - 'Templates/Python/ConnectorFunction/HelloFabric/function_app.py'
      - 'Templates/Python/ConnectorFunction/HelloFabric/functions.metadata'
      - 'Templates/Python/ConnectorFunction/HelloFabric/test_*.py'

permissions:
  contents: read

jobs:
  python-t2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Templates/Python/ConnectorFunction/HelloFabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing test dependencies
        run: python -m pip install aiohttp==3.14.1 pytest
      - name: Compile Python sources
        run: python -m py_compile function_app.py test_function_app.py test_fabric_mcp.py test_fabric_mcp_daily.py
      - name: Run shared ConnectorFunction tests
        run: python -m pytest -q test_function_app.py test_fabric_mcp.py test_fabric_mcp_daily.py
      - name: Verify deterministic shared archives
        working-directory: .
        run: python .github/scripts/repack_connector_function.py Templates/Python/ConnectorFunction/HelloFabric --check

  check-zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check zip member permissions
        run: python .github/scripts/check_zip_permissions.py