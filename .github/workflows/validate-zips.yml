name: Validate zip archives

on:
  pull_request:
    paths:
      - '**/*.zip'
      - '.github/scripts/check_zip_permissions.py'
      - '.github/workflows/validate-zips.yml'
      - 'Templates/Python/ConnectorFunction/HelloFabric/function_app.py'
      - 'Templates/Python/ConnectorFunction/HelloFabric/functions.metadata'

permissions:
  contents: read

jobs:
  check-zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check zip permissions, contents, and parity
        run: python .github/scripts/check_zip_permissions.py